<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 시간표 생성기</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>시간표 생성기</h1>
        
        <!-- 데이터 포맷 설정 (드래그 앤 드롭) -->
        <div class="format-builder">
            <span class="label">데이터 순서 설정</span>
            <div class="sortable-list" id="sortableList">
                <div class="sortable-item" draggable="true" data-type="name">강의명</div>
                <div class="sortable-item" draggable="true" data-type="place">장소</div>
                <div class="sortable-item" draggable="true" data-type="time">시간</div>
            </div>
            <select id="separator" class="separator-select">
                <option value=",">구분자: 쉼표 (,)</option>
                <option value="/">구분자: 슬래시 (/)</option>
                <option value=" ">구분자: 공백 ( )</option>
            </select>
        </div>

        <!-- 텍스트 붙여넣기 영역 -->
        <div class="input-group">
            <input type="text" id="rawInput" placeholder="강의 정보 붙여넣기 (예: 생활속의 예술, E0107, 월 1-2)" autocomplete="off">
            <button id="addBtn">자동 생성</button>
        </div>

        <div id="toastMessage" class="toast">입력 정보를 다시 확인해 주세요.</div>

        <div class="table-container">
            <table id="timetable">
                <thead>
                    <tr>
                        <th></th>
                        <th>월</th>
                        <th>화</th>
                        <th>수</th>
                        <th>목</th>
                        <th>금</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JS에서 행 자동 생성 -->
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
